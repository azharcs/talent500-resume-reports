<!DOCTYPE html>
<html lang="en">
<head>

.card{max-width:480px;width:100%;background:#fff;border:1px solid #E7E5EF;border-radius:18px;padding:40px;text-align:center;box-shadow:0 8px 32px rgba(23,20,31,.06)}

.badge{display:inline-block;background:#EEEBFE;color:#3A28B8;font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;padding:6px 14px;border-radius:99px;margin-top:20px;letter-spacing:.04em}

<body>
<div class="card">
  <a class="logo" href="https://talent500.co">TALENT<span>500</span></a>
